services:
  # ==============================================================================
  # Primary Service: Instagram Telegram Bot
  # ==============================================================================
  instagram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_autoposting_bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # --- Telegram Bot ---
      - BOT_TOKEN=${BOT_TOKEN:-}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}

      # --- Instagram Graph API ---
      - IG_USER_ID=${IG_USER_ID:-}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN:-}
      - IG_GRAPH_API_VERSION=${IG_GRAPH_API_VERSION:-v21.0}

      # --- Google Gemini AI (Optional) ---
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # --- Storage Selection ("r2", "s3", or "local") ---
      - STORAGE_TYPE=${STORAGE_TYPE:-r2}

      # --- Cloudflare R2 Settings ---
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-instagram-media}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}

      # --- Generic S3 Settings (AWS S3, MinIO, Wasabi) ---
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN:-}

      # --- Local Storage & Server Settings ---
      - LOCAL_STORAGE_DIR=${LOCAL_STORAGE_DIR:-/app/data/media}
      - LOCAL_PUBLIC_BASE_URL=${LOCAL_PUBLIC_BASE_URL:-}
      - LOCAL_SERVER_ENABLED=${LOCAL_SERVER_ENABLED:-false}
      - LOCAL_SERVER_HOST=${LOCAL_SERVER_HOST:-0.0.0.0}
      - LOCAL_SERVER_PORT=${LOCAL_SERVER_PORT:-3018}

      # --- Automatic Media Cleanup / TTL ---
      - MEDIA_CLEANUP_ENABLED=${MEDIA_CLEANUP_ENABLED:-true}
      - MEDIA_TTL_MINUTES=${MEDIA_TTL_MINUTES:-120}
      - MEDIA_CLEANUP_INTERVAL_MINUTES=${MEDIA_CLEANUP_INTERVAL_MINUTES:-30}

    # Port is only needed when STORAGE_TYPE=local and LOCAL_SERVER_ENABLED=true
    ports:
      - "${LOCAL_SERVER_PORT:-3018}:${LOCAL_SERVER_PORT:-3018}"
    volumes:
      - ./data/media:/app/data/media
    networks:
      - bot-network
    # Resource constraints (server protection)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Log rotation (prevents disk space exhaustion)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==============================================================================
  # Optional Service: Cloudflare Tunnel (Secured HTTPS without opening ports)
  # Launch: docker compose --profile tunnel up -d
  # ==============================================================================
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_media_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - bot-network
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel run
    depends_on:
      - instagram-bot

networks:
  bot-network:
    driver: bridge
