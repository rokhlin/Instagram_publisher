services:
  # ==============================================================================
  # Primary Service: Instagram Telegram Bot
  # ==============================================================================
  instagram-bot:
    image: ghcr.io/rokhlin/instagram_publisher:latest
    container_name: instagram_autoposting_bot
    restart: unless-stopped
    env_file:
      - path: ./config/.env
        required: false
    environment:
      # Instagram Graph API Configuration
      - IG_GRAPH_API_VERSION=v21.0
      # Google Gemini AI Configuration
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Storage Selection: "r2", "s3", or "local"
      - STORAGE_TYPE=r2
      # Automatic Media Cleanup (TTL)
      - MEDIA_CLEANUP_ENABLED=true
      - PGID=1000
      - PUID=1000
      - TZ=Asia/Jerusalem
    ports:
      - 3018:3018
    volumes:
      - ./data/media:/app/data/media
      # - ./src:/app/src # Uncomment for local live-code development
    networks:
      - bot-network
    # Resource constraints (server protection)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Log rotation (prevents disk space exhaustion)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
networks:
  bot-network:
    driver: bridge
