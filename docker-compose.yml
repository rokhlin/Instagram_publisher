services:
  # ==============================================================================
  # Primary Service: Instagram Telegram Bot
  # ==============================================================================
  instagram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_autoposting_bot
    restart: unless-stopped
    env_file:
      - ./config/.env

    # Port is only needed when STORAGE_TYPE=local and LOCAL_SERVER_ENABLED=true
    ports:
      - "${LOCAL_SERVER_PORT:-3018}:${LOCAL_SERVER_PORT:-3018}"
    volumes:
      - ./src:/app/src
      - ./data/media:/app/data/media
    networks:
      - bot-network
    # Resource constraints (server protection)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Log rotation (prevents disk space exhaustion)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==============================================================================
  # Optional Service: Cloudflare Tunnel (Secured HTTPS without opening ports)
  # Launch: docker compose --profile tunnel up -d
  # ==============================================================================
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare_media_tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    networks:
      - bot-network
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel run
    depends_on:
      - instagram-bot

networks:
  bot-network:
    driver: bridge
